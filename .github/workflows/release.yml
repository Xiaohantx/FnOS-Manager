name: Build and Publish Release

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS ARM64 DMG
    runs-on: macos-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '/^## [0-9]+\.[0-9]+\.[0-9]+/ { print $2; exit }' CHANGELOG.md)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not read a semantic version from CHANGELOG.md" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app and DMG
        run: ./scripts/build_dmg.sh "${{ steps.meta.outputs.version }}"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: build/FnOS-Manager-${{ steps.meta.outputs.version }}-arm64.dmg

  publish:
    name: Publish macOS Release
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: ./artifacts

      - name: Prepare release notes
        shell: bash
        env:
          VERSION: ${{ needs.build-macos.outputs.version }}
          TAG: ${{ needs.build-macos.outputs.tag }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [[ ! -s release_notes.md ]]; then
            echo "No changelog section found for $VERSION" >&2
            exit 1
          fi

          DMG_FILE="./artifacts/FnOS-Manager-${VERSION}-arm64.dmg"
          test -f "$DMG_FILE"
          DMG_HASH=$(sha256sum "$DMG_FILE" | awk '{print $1}')
          cat <<EOF >> release_notes.md

          ---

          ### 📦 macOS ARM64 安装包
          [FnOS-Manager-${VERSION}-arm64.dmg](https://github.com/Xiaohantx/FnOS-Manager/releases/download/${TAG}/FnOS-Manager-${VERSION}-arm64.dmg)

          ### SHA-256
          - FnOS-Manager-${VERSION}-arm64.dmg: ${DMG_HASH}
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-macos.outputs.version }}
          TAG: ${{ needs.build-macos.outputs.tag }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          DMG_FILE="./artifacts/FnOS-Manager-${VERSION}-arm64.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG_FILE" --clobber
            gh release edit "$TAG" --title "FnOS Manager $TAG (macOS ARM64)" --notes-file release_notes.md
          else
            gh release create "$TAG" "$DMG_FILE" \
              --target "$GITHUB_SHA" \
              --title "FnOS Manager $TAG (macOS ARM64)" \
              --notes-file release_notes.md
          fi
